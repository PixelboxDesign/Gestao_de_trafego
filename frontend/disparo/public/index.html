<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luna Cosméticos — Disparo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f0f;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 { font-size: 2rem; color: #e91e63; margin-bottom: 0.5rem; }
    p  { color: #94a3b8; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌙 Luna Cosméticos</h1>
    <p>Disparo — em construção</p>
  </div>
  <script>
    // Busca a URL da API do backend ao iniciar
    fetch('/config')
      .then(r => r.json())
      .then(cfg => {
        window.__LUNA_API__ = cfg.api;
        console.log('[Luna Disparo] API:', cfg.api);
      });
  </script>
</body>
</html>
