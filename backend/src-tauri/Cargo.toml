# BUILD: v10-THUMB-CARROSSEL
# Sistema de thumb + carrossel implementado
# - Thumb separada (thumb.*) para capa
# - Múltiplas imagens de carrossel (img_timestamp_contador.ext)
# - Upload/delete separados para cada tipo
# - Painel controle + frontend site atualizados

[package]
name = "luna-server"
version = "0.1.0"
description = "Luna Cosméticos — Tauri Server (backend central 24/7)"
authors = ["Matheus Maia"]
edition = "2021"

[lib]
name = "luna_server_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "luna-server"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"

# HTTP Server (API REST interna)
axum = { version = "0.7", features = ["json", "ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tower = "0.4"

# Banco de dados
sqlx = { version = "0.7", features = ["runtime-tokio", "mysql", "chrono", "uuid"] }

# Serialização
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Autenticação
jsonwebtoken = "9"
bcrypt = "0.15"

# Utilitários
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
anyhow = "1"
thiserror = "1"
mime_guess = "2"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"

[profile.release]
panic = "abort"
codegen-units = 16        # Aumentado de 1 para 16 (paraleliza build)
lto = "thin"              # Mudado de true para "thin" (mais rápido)
opt-level = "z"           # Otimiza para tamanho
strip = true
incremental = true        # Habilita compilação incremental
